# Reverse proxy for an AgentCowork hub (MCP Streamable HTTP + Web UI + SSE).
# msg_wait keeps a request open for up to AGENTCOWORK_WAIT_MAX_SECONDS (default 240 s)
# and streams progress notifications, so the two things that matter are:
#   1. proxy_read_timeout above the wait limit;
#   2. proxy_buffering off, so progress notifications and SSE events reach clients at once.
# Add TLS (listen 443 ssl + certificates) in front for anything beyond a trusted LAN.

upstream agentcowork {
    server 127.0.0.1:7420;
    keepalive 16;
}

server {
    listen 80;
    server_name agentcowork.example.internal;

    client_max_body_size 4m;

    location / {
        proxy_pass http://agentcowork;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived MCP and SSE responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
